[tool.coverage.report]
exclude_lines = [
  'if __name__ == .__main__.:',
  'if TYPE_CHECKING:',
  'pragma: no cover',
]
precision = 2

[tool.coverage.run]
branch = true
cover_pylib = false
omit = [
  '**/__init__.py',
  '**/conftest.py',
  '**/laplskel/_version.py',
  '**/laplskel/cli/*',
  '**/laplskel/due.py',
  '**/tests/**',
]

[tool.ruff]
extend-exclude = ['docs', 'versioneer.py', 'setup.py']
line-length = 88
target-version = 'py38'

[tool.ruff.format]
docstring-code-format = true
line-ending = 'lf'
quote-style = "single"

[tool.ruff.lint]
ignore = []
select = ['A', 'B', 'E', 'D', 'F', 'I', 'UP', 'W']

[tool.ruff.lint.pydocstyle]
convention = 'numpy'

[tool.ruff.lint.per-file-ignores]
'*' = [
  'B904', # 'Within an except clause, raise exceptions with raise ... from ...'
  'UP007', # 'Use `X | Y` for type annotations', requires python 3.10
  'N816', # Math is math. Leave me alone.
  'N806',
  'N803'
]
'*.pyi' = ['E501']
'__init__.py' = ['F401']
'_version.py' = ['UP031']
'laplskel/tests/*' = ['D']
'laplskel/__init__.py' = ['F401', 'D']
'laplskel/*/__init__.py' = ['F401', 'D']
'laplskel/_version.py' = ['UP031', 'D']
'laplskel/conftest.py' = ['D']
'laplskel/due.py' = ['D']
